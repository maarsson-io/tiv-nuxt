name: Dependabot Retarget

# Security updates always open against the default branch (master);
# move them to develop so they follow the regular release flow.
# pull_request_target is required for a writable token on Dependabot PRs.
# No PR code is checked out, so this is safe.
# Dependabot ignores commands from bots, so after a retarget comment
# `@dependabot recreate` on the PR manually to rebuild it on develop.
on:
  pull_request_target:
    types:
      - opened
    branches:
      - master

permissions:
  pull-requests: write

jobs:
  retarget:
    name: Retarget to develop
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Change Base Branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = context.payload.pull_request.number;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              base: 'develop',
            });

            core.info(`PR #${pull_number} retargeted to develop`);
